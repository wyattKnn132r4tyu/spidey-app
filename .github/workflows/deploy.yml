name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/spidey-tracker-brainstorm-ifhm67
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a running one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Project pages are served from /<repo>/, so assets need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages serves 404.html for unknown paths; the SPA shell handles routing.
      - run: cp dist/index.html dist/404.html

      # A second, path-independent copy under /app/. That is where the app lives
      # while Pages publishes the branch itself rather than this artifact, and
      # rebuilding it here keeps the same link working under either source.
      - run: npm run build:pages && cp -r app dist/app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
