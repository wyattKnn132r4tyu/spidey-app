name: Android widget

on:
  push:
    paths:
      - 'widgets/android/**'
      - 'src/lib/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widgets/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Fails if the Kotlin port has drifted from the app's TypeScript model.
      - name: Parity and render tests
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: spidey-widget-debug-apk
          path: widgets/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
