<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS ignores manifest icons for the home screen and uses this instead. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- No maximum-scale or user-scalable=no: blocking pinch-zoom locks out
         anyone who needs to magnify text. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spidey" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Crowd-sourced sighting map and patrol tracker with time-decaying confidence."
    />
    <title>Spidey Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
